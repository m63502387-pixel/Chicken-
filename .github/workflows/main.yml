name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /root/.config/godot ~/.config/godot

      - name: Enable ETC2/ASTC textures
        run: sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot

      - name: Create debug key
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android Debug" build/chicks_rescue.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chicks_rescue-apk
          path: build/chicks_rescue.apk
